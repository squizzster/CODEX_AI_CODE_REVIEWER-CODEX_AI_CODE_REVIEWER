schema_version: 1
id: code-review.perform-review
module: code-review
purpose: Produce and persist six independent specialist reports and one audited comparison.
status: active
shape: workflow
entrypoints:
  - kind: cli
    operation: ./run_the_code_review [--model MODEL] [--reasoning EFFORT] [--reports-directory DIRECTORY] <directory>
  - kind: cli
    operation: ./perform_a_code_review.py [--model MODEL] [--reasoning EFFORT] [--reports-directory DIRECTORY] <directory>
inputs:
  - existing readable and traversable review directory
  - repository-owned prompt and variable YAML
  - optional run-scoped model and reasoning overrides
  - optional reports root override
outcomes:
  - versioned JSON result on stdout
  - one reports/<project_name>/<review_started_at_utc>/ directory
  - one <PROMPT_NAME>_OUTPUT.md file for each specialist and the comparison
  - each completed prompt owns one run-local <PROMPT_NAME>_OUTPUT variable
  - each prompt output variable contains the one Markdown report found in that prompt's outputs directory
  - each stock-executor workspace is initialized from its first location-bearing live event
failures:
  - invalid directory, configuration, or variable graph returns exit code 2
  - catalogue or execution failure returns exit code 2
  - an incomplete specialist stage prevents comparison and publication
policies: []
data:
  reads:
    - conf/projects/**/*.yaml
    - conf/vars/*.yaml
    - reviewed directory through Prompt Runner
  writes:
    - Prompt Runner catalogue state
    - Prompt Runner isolated-workspace/{source_code_read_only_link,outputs,final_md_report,tmp,temp_scripts,scratch_pad,README.md}
    - reports/<project_name>/<review_started_at_utc> after successful comparison
verification:
  - uv run pytest
  - uv run ruff check .
  - uv build
  - mva validate
open_questions:
  - add an acknowledged workspace-ready handshake before Codex launch
extensions:
  prompt_project: CODEX_AI_CODE_REVIEW
  specialist_prompts:
    - ANALYZE_PIPELINE
    - ANALYZE_BOUNDARIES
    - ANALYZE_NETWORKING
    - ANALYZE_INTEGRITY
    - ANALYZE_SECURITY
    - ANALYZE_PERFORMANCE
  disabled_specialist_prompts:
    - ANALYZE_RECONNAISSANCE
  comparison_prompt: COMPARE_AGENT_REPORTS
  execution:
    specialist_concurrency: 6
    comparison_requires_all_specialists: true
    prompt_delivery_mode: LIVE
    live_event_consumption:
      timing: real_time
      pipeline: parse one JSONL event, invoke its handler, then forward it to stderr
      workspace_trigger: initial executing event containing isolated_workspace
      workspace_operation: create_runner_work_space returns 1 or 0
      source_code_link: source_code_read_only_link -> reviewed directory
      workspace_directories:
        - outputs
        - tmp
        - temp_scripts
        - scratch_pad
      final_report_link: final_md_report -> outputs
      output_contract:
        scan: direct children of outputs
        markdown_files_required: exactly_one
        file_requirements: nonempty regular file, not a symlink
        prompt_runner_final_message: retained as execution metadata, excluded from comparison evidence
      workspace_readme: resolved specialist instruction or comparison prompt
      cached_result_creates_workspace: false
      custom_executor_without_isolated_workspace: event accepted, review fails the file-output contract
    default_model: gpt-6-astra
    default_reasoning_effort: xhigh
    invocation_overrides_apply_to_all_prompts: true
    invocation_overrides_do_not_mutate_catalogue_defaults: true
    prompt_output_variables:
      naming: <PROMPT_NAME>_OUTPUT
      owner: completed_prompt
      caller_override: forbidden
      value_expansion: opaque
      specialist_completion_order_affects_identity: false
      comparison_inputs:
        - ANALYZE_BOUNDARIES_OUTPUT
        - ANALYZE_PIPELINE_OUTPUT
        - ANALYZE_NETWORKING_OUTPUT
        - ANALYZE_INTEGRITY_OUTPUT
        - ANALYZE_SECURITY_OUTPUT
        - ANALYZE_PERFORMANCE_OUTPUT
    report_publication:
      default_root: reports/
      directory_shape: <project_name>/<YYYY-MM-DDTHH-MM-SS.hundredthsZ>/
      run_id_meaning: review orchestration start time in UTC
      file_naming: <PROMPT_NAME>_OUTPUT.md
      requires_complete_pipeline: true
      publication: atomic_directory_rename
      staging_visibility: hidden_until_complete
    risk_profiles:
      ANALYZE_PIPELINE: BALANCED
      ANALYZE_BOUNDARIES: BALANCED
      ANALYZE_NETWORKING: NETWORKED_WORKSPACE
      ANALYZE_INTEGRITY: BALANCED
      ANALYZE_SECURITY: NETWORKED_WORKSPACE
      ANALYZE_PERFORMANCE: BALANCED
      COMPARE_AGENT_REPORTS: NETWORKED_WORKSPACE
  operational_limits:
    - specialist reports cross the Prompt Runner boundary as process arguments
    - runs have no persisted resume state
    - generated reports require external retention management
    - an acknowledged workspace-ready handshake remains a TODO
